# Serve the panel under https://brawlboost.us/targetpanel
# Place in /etc/nginx/sites-available/ and symlink into sites-enabled/.
# TLS certificates via certbot: sudo certbot --nginx -d brawlboost.us

server {
    listen 80;
    server_name brawlboost.us;
    # Redirect all HTTP to HTTPS (certbot usually adds this automatically).
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name brawlboost.us;

    ssl_certificate     /etc/letsencrypt/live/brawlboost.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brawlboost.us/privkey.pem;

    location /targetpanel/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /targetpanel;
    }

    # Redirect /targetpanel (no trailing slash) to /targetpanel/
    location = /targetpanel {
        return 301 /targetpanel/;
    }
}

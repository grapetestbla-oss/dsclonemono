{% extends "base.html" %}
{% block title %}Вход — Панель{% endblock %}
{% block content %}
<div style="max-width:380px;margin:8vh auto 0;">
  <div class="card">
    <h1 style="text-align:center;">Вход в панель</h1>
    <form method="post" action="{{ url_for('login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <label for="username">Логин</label>
      <input id="username" name="username" autocomplete="username" autofocus required>
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit" style="width:100%;margin-top:18px;">Войти</button>
    </form>
  </div>
</div>
{% endblock %}

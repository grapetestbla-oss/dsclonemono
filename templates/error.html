{% extends "base.html" %}
{% import "_ui.html" as ui %}
{% block title %}Ошибка {{ code }}{% endblock %}
{% block content %}
<div class="error-wrap">
  <div class="rise">
    <div class="error-code">{{ code }}</div>
    <p>{{ message }}</p>
    <a class="btn" href="{{ url_for('index') }}">{{ ui.icon('arrow-left') }} На главную</a>
  </div>
</div>
{% endblock %}
